common:
  platform_allow: [native_sim]
  integration_platforms: [native_sim]
  tags: [rzi, at, lora]
tests:
  rzi.at.commands.lora: {}
  rzi.at.commands.lora.dual:
    extra_configs:
      - CONFIG_RZI_LORAWAN=y
      - CONFIG_RZI_LORAWAN_BACKEND_TEST=y
      - CONFIG_RZI_AT_COMMAND_LORAWAN=y
  rzi.at.commands.lora.nvm:
    extra_configs:
      - CONFIG_RZI_LORAWAN=y
      - CONFIG_RZI_LORAWAN_BACKEND_TEST=y
      - CONFIG_RZI_AT_COMMAND_LORAWAN=y
      - CONFIG_RZI_AT_NVM=y
      - CONFIG_FLASH=y
      - CONFIG_SETTINGS_NVS=y
      - CONFIG_MAIN_STACK_SIZE=4096
