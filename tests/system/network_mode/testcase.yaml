common:
  platform_allow: [native_sim]
  integration_platforms: [native_sim]
  tags: [rzi, network_mode]
tests:
  rzi.system.network_mode: {}
  rzi.system.network_mode.storage:
    extra_configs:
      - CONFIG_RZI_STORAGE=y
  rzi.system.network_mode.nvs:
    extra_configs:
      - CONFIG_RZI_STORAGE=y
      - CONFIG_FLASH=y
      - CONFIG_FLASH_MAP=y
      - CONFIG_NVS=y
      - CONFIG_SETTINGS_NVS=y
      - CONFIG_MAIN_STACK_SIZE=4096
