CONFIG_PM=y
# Idle enters STOP2 through pm_system_suspend(). The 256-byte default overflows.
CONFIG_IDLE_STACK_SIZE=512

# RTC keeps time and provides the wake alarm while SysTick stops in STOP2.
CONFIG_COUNTER=y
CONFIG_COUNTER_RTC_STM32_SUBSECONDS=y
CONFIG_SYSTEM_TIMER_LPM_COMPANION_COUNTER=y
